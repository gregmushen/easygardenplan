<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Easy Garden Plan</title><desc id="description">A garden bed plan with crops and a seasonal path.</desc>
  <rect width="1200" height="630" fill="#f7f3e8"/><circle cx="1090" cy="40" r="260" fill="#dcebc8"/><circle cx="80" cy="650" r="300" fill="#e9d6b2"/>
  <g transform="translate(770 145) rotate(-4)"><rect width="320" height="350" rx="30" fill="#fffdf7" stroke="#284f35" stroke-width="8"/><rect x="32" y="35" width="256" height="230" rx="18" fill="#d8bd8d"/><rect x="50" y="53" width="110" height="120" rx="14" fill="#8dbb72"/><rect x="172" y="53" width="98" height="54" rx="14" fill="#bdd58c"/><rect x="172" y="119" width="98" height="54" rx="14" fill="#74ad79"/><rect x="50" y="185" width="220" height="62" rx="14" fill="#bdd58c"/><path d="M60 302h200" stroke="#d7ded3" stroke-width="12" stroke-linecap="round"/><circle cx="76" cy="302" r="15" fill="#d06a46"/></g>
  <text x="90" y="185" fill="#40734b" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="4">EASY GARDEN PLAN</text>
  <text x="90" y="285" fill="#1e3324" font-family="Georgia, serif" font-size="68" font-weight="700">Know what to plant.</text><text x="90" y="370" fill="#1e3324" font-family="Georgia, serif" font-size="68" font-weight="700">Know when to do it.</text>
  <text x="90" y="455" fill="#607064" font-family="Arial, sans-serif" font-size="28">A practical plan for your exact patch of ground.</text>
